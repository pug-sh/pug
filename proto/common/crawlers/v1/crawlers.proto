edition = "2023";
package common.crawlers.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/common/crawlers/v1;commoncrawlersv1";

// The crawler table, read by the server and @pug-sh/crawlers. Other search
// engines and SEO tools come from the crawler-user-agents list. buf refuses
// deleting a row, so retire one with deprecated = true.

// Category is why a crawler fetches a page.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  // Fetched live because a person asked an AI product or assistant.
  CATEGORY_ANSWERS = 1;
  // Builds a search index that search results and AI answers draw on.
  CATEGORY_SEARCH = 2;
  // Collects pages to train models.
  CATEGORY_TRAINING = 3;
  // Crawls for an SEO tool: backlink indexes, rank tracking, site audits.
  CATEGORY_SEO = 4;
  // AI-related, but none of the above.
  CATEGORY_OTHER = 5;
}

extend google.protobuf.EnumValueOptions {
  // The agent's tokens. A token matches a User-Agent case-insensitively, as a
  // whole word. The first is the agent's name.
  repeated string token = 50000;
  string company = 50001;
  Category category = 50002;
  // Where the operator publishes the agent's IP ranges; none when it publishes none.
  repeated string ip_ranges = 50003;
  // The operator's page that describes the agent.
  string operator_page = 50004;
  // The open lists that name an agent whose operator publishes no page.
  repeated string listed_by = 50005;
}

