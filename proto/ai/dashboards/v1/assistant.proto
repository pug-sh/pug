edition = "2023";
package ai.dashboards.v1;

import "buf/validate/validate.proto";
import "dashboard/dashboards/v1/dashboards.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/ai/dashboards/v1;aidashboardsv1";

// DashboardAssistantService turns a conversation into validated edits to a
// dashboard draft. It is stateless: the client owns the draft and the history,
// and both round-trip through ConversationState on every turn.
//
// The service is implemented outside this repo (es/pug-sh/ai) and calls back
// into shared.insights.v1 with the caller's forwarded JWT, so its reads are
// authorized exactly as the user's own.
service DashboardAssistantService {
  // Turn processes one user message against the current draft and streams back
  // assistant prose plus zero or more validated tile operations.
  rpc Turn(TurnRequest) returns (stream TurnResponse);
}

message TurnRequest {
  ConversationState state = 1;
  string message = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
}

message ConversationState {
  repeated Message messages = 1 [(buf.validate.field).repeated.max_items = 200];
  // The draft the operations apply to. Reuses Dashboard so it is the same
  // message the webapp's draft state already holds and buildUpsertRequest
  // already consumes.
  dashboard.dashboards.v1.Dashboard draft = 2;
}

message Message {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_ASSISTANT = 2;
  }
  Role role = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string content = 2;
}

message TurnResponse {
  oneof chunk {
    // Assistant prose, streamed incrementally.
    string text = 1;
    // One operation. Validated against the tile's own protovalidate rules — but
    // see TileOp.violations: a tile the assistant could not make valid is still
    // emitted, flagged, so the user can correct it by hand.
    TileOp op = 2;
    TurnDone done = 3;
  }
}

message TurnDone {
  // Tiles the assistant abandoned without producing an op at all. A tile that
  // merely failed validation is emitted as a flagged TileOp instead, so in
  // practice this carries only assistant-side faults (e.g. a misconfigured
  // validator, where flagging would mean shipping a tile nothing ever checked).
  // Empty on a clean turn; clients should surface it as an error, not as a
  // correctable draft.
  repeated FailedOp failed = 1;
}

message FailedOp {
  string intent = 1;
  repeated string violations = 2;
}

// TileOp is a single edit to the draft. Operations rather than a whole-draft
// rewrite: a tile the model never mentions is untouched by construction, so
// silence can never delete. DashboardsService.Upsert deletes tiles absent from
// its request, which makes that distinction load-bearing.
message TileOp {
  oneof op {
    option (buf.validate.oneof).required = true;
    AddTile add = 1;
    UpdateTile update = 2;
    RemoveTile remove = 3;
  }

  // Non-empty when the assistant could not make this tile valid within its
  // repair budget and is surfacing it for manual correction. The strings are
  // the protovalidate violation messages verbatim — already human-readable
  // prose, suitable to show the user.
  //
  // A flagged tile is deliberately NOT save-safe: DashboardsService.Upsert runs
  // the same rules server-side and will reject it. Clients must render it as a
  // must-fix draft state and block save until it validates. An op with no
  // violations passed validation and can be saved normally.
  repeated string violations = 4;
}

message AddTile {
  dashboard.dashboards.v1.DashboardTileInput tile = 1 [(buf.validate.field).required = true];
}

// UpdateTile replaces the whole tile rather than carrying a field mask: the
// model receives the current tile in context and returns the updated one, which
// is markedly easier for a language model to get right. The blast radius is one
// tile either way.
message UpdateTile {
  string tile_id = 1 [(buf.validate.field).string.min_len = 1];
  dashboard.dashboards.v1.DashboardTileInput tile = 2 [(buf.validate.field).required = true];
}

message RemoveTile {
  string tile_id = 1 [(buf.validate.field).string.min_len = 1];
}
