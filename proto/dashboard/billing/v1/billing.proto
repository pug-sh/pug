edition = "2023";

package dashboard.billing.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/dashboard/billing/v1;billingv1";

service BillingService {
  // What the org may send this period: plan, quota, and the window both are
  // measured over. Usage is UsageService.GetUsage; a client renders "X of Y"
  // from both. Plan fields arrive already resolved, overrides applied.
  rpc GetBillingStatus(GetBillingStatusRequest) returns (GetBillingStatusResponse) {}

  // Opens a mandate-only checkout: it authorizes a payment method and charges
  // nothing. Admin-only, since it is the step that lets pug take money. The
  // request names a plan slug -- the current rate card or custom -- never an
  // amount; usage is priced and charged by pug after each period.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse) {}

  // Verifies one checkout against the provider and applies its subscription:
  // what confirms a returning buyer on a deployment with no reachable webhook
  // URL. Admin-only, like the checkout it settles. session_id is a claim -- the
  // subscription must carry this org.
  rpc ConfirmCheckout(ConfirmCheckoutRequest) returns (ConfirmCheckoutResponse) {}

  // Opens the provider's customer portal, where card updates, invoices and the
  // provider's own cancellation live -- hence no ChangePlan. Cancelling through
  // pug is RemovePaymentMethod, which charges the period first.
  // FailedPrecondition for an org that has never checked out.
  rpc CreatePortalSession(CreatePortalSessionRequest) returns (CreatePortalSessionResponse) {}

  // The current rate card, plus custom for an org whose row records a deal. On
  // the viewer floor: the person reading the quota banner wants to know what
  // usage costs, they just cannot add a card.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {}

  // The running period priced so far, on the viewer floor beside the usage
  // meter: the same count, priced. Read `counted` before rendering an amount.
  rpc GetUpcomingInvoice(GetUpcomingInvoiceRequest) returns (GetUpcomingInvoiceResponse) {}

  // Closed periods newest first, with the provider's receipt. Admin-only: a
  // receipt carries a company's billing details.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {}

  // Pug's own cancellation, in the order the portal cannot promise: close the
  // period to date, charge it, then cancel the mandate. The period is closed at
  // now minus the invoicing grace, so the days the meter has not finalized are a
  // write-off, and the mandate is left LIVE unless the charge settled. Admin-only.
  rpc RemovePaymentMethod(RemovePaymentMethodRequest) returns (RemovePaymentMethodResponse) {}
}

// BillingStatus is derived from the clock and the ledger on every read, never
// stored. The states a provider reports live on SubscriptionStatus instead.
enum BillingStatus {
  BILLING_STATUS_UNSPECIFIED = 0;
  // Inside the trial window, which runs from org creation unless extended.
  BILLING_STATUS_TRIALING = 1;
  // Holding a granted plan whose contract has not lapsed.
  BILLING_STATUS_ACTIVE = 2;
  // The floor: never trialed, trial expired, or a contract that has ended.
  BILLING_STATUS_FREE = 3;
  // An invoice failed or is uncollectible. Derived from the ledger, so it clears
  // the moment a retry succeeds -- but nothing ages it out, so an uncollectible
  // invoice holds it until a retry, a new card or an operator void. Worth a
  // banner, never a degraded product.
  BILLING_STATUS_PAST_DUE = 4;
}

// RateCard prices usage in graduated tiers over cumulative 100k-event blocks:
// each tier charges the blocks up to and including up_to_block, and the last
// tier's 0 is unbounded.
message RateCard {
  int64 block_events = 1;
  // Blocks free every period before the first tier applies.
  int64 free_blocks = 2;
  repeated RateTier tiers = 3;
}

message RateTier {
  int64 up_to_block = 1;
  int64 cents_per_block = 2;
}

// CustomTerms is a negotiated deal, priced in pug: a flat fee every period, a
// flat rate per block over the allowance, or both. ABSENT means none.
message CustomTerms {
  google.protobuf.Int64Value flat_fee_cents = 1;
  google.protobuf.Int64Value block_rate_cents = 2;
  google.protobuf.Int64Value included_events = 3;
}

// SubscriptionStatus is the provider subscription behind the entitlement, in pug's
// own vocabulary. Only UNSPECIFIED, ACTIVE and PAST_DUE are ever emitted -- the
// rest exist because a stored row holds them.
enum SubscriptionStatus {
  // No live subscription: trialing, free, comped, or no provider configured.
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_ACTIVE = 1;
  // The card failed and the provider is retrying. The entitlement is UNCHANGED:
  // worth a banner, never a block.
  SUBSCRIPTION_STATUS_PAST_DUE = 2;
  SUBSCRIPTION_STATUS_PAUSED = 3;
  SUBSCRIPTION_STATUS_CANCELLED = 4;
  SUBSCRIPTION_STATUS_EXPIRED = 5;
  SUBSCRIPTION_STATUS_FAILED = 6;
}

message GetBillingStatusRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Plan is the tier as this org holds it, overrides applied.
message Plan {
  string slug = 1;
  string display_name = 2;
  // ABSENT for every card and every deal: usage is priced per block, so there is
  // no single price to name -- read rate_card or custom_terms instead. Set only
  // when billing is switched off, where it is the free floor's 0. A wrapper
  // because a bare int64 would reach the dashboard as 0.
  google.protobuf.Int64Value price_cents = 3;
  // ISO 4217.
  string currency = 4;
}

message GetBillingStatusResponse {
  // False on a deployment with billing switched off. Hide every billing surface.
  bool billing_enabled = 1;
  Plan plan = 2;
  BillingStatus status = 3;
  // Events the org may send this period. ABSENT means NO QUOTA -- billing is off,
  // or the plan carries none. Never render its absence as 0.
  google.protobuf.Int64Value included_events = 4;
  // When the trial ends, or when it ended. Kept once past, where it says why an
  // org is on the free floor. Absent only with billing switched off.
  google.protobuf.Timestamp trial_ends_at = 5;
  // When a granted plan lapses back to the free floor; absent means open-ended.
  // The end of the agreement, NOT of the quota window.
  google.protobuf.Timestamp contract_ends_at = 6;
  // The quota window, which runs from the org's billing anniversary. Identical to
  // GetUsage's period bounds, which is what makes "X of Y" like for like.
  google.protobuf.Timestamp period_start = 7;
  google.protobuf.Timestamp period_end = 8;
  SubscriptionStatus subscription_status = 9;
  // When the provider bills next: the MONEY's period, not the quota's above.
  // Absent when there is no live subscription.
  google.protobuf.Timestamp current_period_end = 10;
  // Whether a checkout would open at all -- billing on, a provider configured, and
  // a product to check out against. Per tier it is PlanOption.purchasable.
  bool purchasable = 11;
  // Days of event history the plan promises. ABSENT means NO BOUND and is never
  // zero. Nothing in pug deletes on this number today.
  google.protobuf.Int64Value retention_days = 13;
  // Whether a portal session would open: this org has a customer at the provider,
  // which only a checkout leaves behind. Not implied by subscription_status.
  bool manageable = 12;
  // Exactly one of these is set while billing is on and the plan resolves.
  RateCard rate_card = 14;
  CustomTerms custom_terms = 15;
  // A live payment method pug can charge.
  bool chargeable = 16;
  // When the running period is invoiced: period_end plus the invoicing grace.
  google.protobuf.Timestamp next_charge_at = 17;
}

message CreateCheckoutSessionRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // A catalog slug. Never a price and never a product id.
  string plan_slug = 2 [(buf.validate.field).string.min_len = 1];
  // The mode the overlay opens over, so it does not land light on a dark page.
  // The dashboard's resolved theme, not the stored preference -- "system" is
  // already resolved by the time this is sent. UNSPECIFIED leaves the provider's
  // own configured default -- it does not follow the buyer's OS.
  CheckoutTheme theme = 3 [(buf.validate.field).enum.defined_only = true];
}

enum CheckoutTheme {
  CHECKOUT_THEME_UNSPECIFIED = 0;
  CHECKOUT_THEME_LIGHT = 1;
  CHECKOUT_THEME_DARK = 2;
}

message CreateCheckoutSessionResponse {
  // Send the buyer here. Single-use and short-lived; never store it.
  string checkout_url = 1;
  // Hand back to ConfirmCheckout when the buyer returns. Not proof: the server
  // re-reads the checkout. Empty if the provider gives no id.
  string session_id = 2;
}

message ConfirmCheckoutRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // Bounded to the provider's own id alphabet: it is echoed into the provider's
  // URL path, where a `../` would address another endpoint with pug's API key.
  string session_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

message ConfirmCheckoutResponse {
  // False is "not settled yet", never a failure; a checkout that will not settle
  // is an error instead.
  bool confirmed = 1;
}

message CreatePortalSessionRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

message CreatePortalSessionResponse {
  string portal_url = 1;
}

message ListPlansRequest {
  // Scoped to an org because purchasability is: only the org whose row records a
  // deal is offered the custom tier.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

// PlanOption is a tier as this deployment sells it. Plan is a tier as ONE ORG
// holds it, overrides applied.
message PlanOption {
  string slug = 1;
  string display_name = 2;
  // Always ABSENT: pug prices usage per block, so an option has no single price.
  // Kept so a client reading it gets absence rather than a wrong number, and
  // absence is never zero, here or below.
  google.protobuf.Int64Value price_cents = 3;
  // ISO 4217.
  string currency = 4;
  // Events the tier includes. ABSENT is the custom tier.
  google.protobuf.Int64Value included_events = 5;
  // Days of history the tier keeps. ABSENT is the custom tier.
  google.protobuf.Int64Value retention_days = 7;
  // Whether a checkout for THIS tier would open -- the same helper
  // CreateCheckoutSession refuses on, so a dead button is impossible.
  bool purchasable = 6;
  RateCard rate_card = 8;
  CustomTerms custom_terms = 9;
}

message ListPlansResponse {
  repeated PlanOption plans = 1;
}

message InvoiceLine {
  string description = 1;
  int64 blocks = 2;
  int64 cents_per_block = 3;
  int64 amount_cents = 4;
}

message GetUpcomingInvoiceRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetUpcomingInvoiceResponse {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  google.protobuf.Timestamp next_charge_at = 3;
  // The meter's stamp and whether it has summed this period: the same three
  // states as GetUsage. Without `counted`, event_count and amount_cents are
  // absent and must render as "computing", never as $0.
  google.protobuf.Timestamp usage_computed_at = 4;
  bool counted = 5;
  int64 event_count = 6;
  int64 blocks = 7;
  repeated InvoiceLine lines = 8;
  // ABSENT until the count is in and the plan can be priced.
  google.protobuf.Int64Value amount_cents = 9;
  string currency = 10;
}

enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_OPEN = 1;
  INVOICE_STATUS_CHARGING = 2;
  INVOICE_STATUS_CHARGED = 3;
  INVOICE_STATUS_PAID = 4;
  INVOICE_STATUS_FAILED = 5;
  INVOICE_STATUS_UNCOLLECTIBLE = 6;
  INVOICE_STATUS_WAIVED = 7;
  INVOICE_STATUS_VOID = 8;
  INVOICE_STATUS_REFUNDED = 9;
}

message Invoice {
  string id = 1;
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  // The days actually billed: clipped to the mandate and past the trial.
  // billed_to is EXCLUSIVE -- the last day billed is the day before it.
  google.protobuf.Timestamp billed_from = 4;
  google.protobuf.Timestamp billed_to = 5;
  int64 event_count = 6;
  int64 blocks = 7;
  repeated InvoiceLine lines = 8;
  int64 amount_cents = 9;
  string currency = 10;
  InvoiceStatus status = 11;
  // The provider's receipt, once paid.
  string provider_invoice_url = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp paid_at = 14;
  google.protobuf.Timestamp failed_at = 15;
  int32 attempts = 16;
  google.protobuf.Timestamp next_attempt_at = 17;
}

message ListInvoicesRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

message RemovePaymentMethodRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RemovePaymentMethodResponse {}
