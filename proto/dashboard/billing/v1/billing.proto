edition = "2023";

package dashboard.billing.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/dashboard/billing/v1;billingv1";

service BillingService {
  // What the org may send this period: plan, quota, and the window both are
  // measured over. Usage is UsageService.GetUsage; a client renders "X of Y"
  // from both. Plan fields arrive already resolved, overrides applied.
  rpc GetBillingStatus(GetBillingStatusRequest) returns (GetBillingStatusResponse) {}

  // Opens a checkout against the one product every org authorizes against.
  // Admin-only: the quota banner is on the viewer floor, but this is the step
  // that lets pug take money. The request names a plan slug -- the current rate
  // card or custom -- never an amount; usage is priced by pug after each period.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse) {}

  // Verifies one checkout against the provider and applies its subscription:
  // what confirms a returning buyer on a deployment with no reachable webhook
  // URL. Admin-only, like the checkout it settles. session_id is a claim -- the
  // subscription must carry this org.
  rpc ConfirmCheckout(ConfirmCheckoutRequest) returns (ConfirmCheckoutResponse) {}

  // Opens the provider's customer portal, where plan changes, card updates,
  // invoices and cancellation live -- hence no ChangePlan or CancelSubscription.
  // FailedPrecondition for an org that has never checked out.
  rpc CreatePortalSession(CreatePortalSessionRequest) returns (CreatePortalSessionResponse) {}

  // The current rate card, plus custom for an org whose row records a deal. On
  // the viewer floor: the person reading the quota banner wants to know what
  // usage costs, they just cannot buy it. Never returns a product id.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {}
}

// RateCard prices usage in graduated tiers over cumulative events: each tier
// charges the events up to and including up_to_events, and the last tier's 0 is
// unbounded. A rate is cents per MILLION events, so a fraction of a cent per
// event is still a whole number.
message RateCard {
  // Events free every period before the first tier applies.
  int64 free_events = 1;
  repeated RateTier tiers = 2;
}

message RateTier {
  int64 up_to_events = 1;
  int64 cents_per_million = 2;
}

// CustomTerms is a negotiated deal, priced in pug: a flat fee every period, a
// flat rate per million events over the allowance, or both. ABSENT means none --
// never zero, which would read as free.
message CustomTerms {
  google.protobuf.Int64Value flat_fee_cents = 1;
  google.protobuf.Int64Value rate_cents_per_million = 2;
  google.protobuf.Int64Value included_events = 3;
}

// BillingStatus is derived from the clock and the invoice ledger on every read,
// never stored. The states a provider reports live on SubscriptionStatus instead.
enum BillingStatus {
  BILLING_STATUS_UNSPECIFIED = 0;
  // Inside the trial window, which runs from org creation unless extended.
  BILLING_STATUS_TRIALING = 1;
  // Holding a granted plan whose contract has not lapsed.
  BILLING_STATUS_ACTIVE = 2;
  // The floor: never trialed, trial expired, or a contract that has ended.
  BILLING_STATUS_FREE = 3;
  // An invoice failed and is not yet paid, whatever the plan: a retry in flight keeps
  // it, a payment clears it. Worth a banner, never a block: events are still accepted.
  BILLING_STATUS_PAST_DUE = 4;
}

// PastDueReason is what a past-due org has to do about it.
enum PastDueReason {
  PAST_DUE_REASON_UNSPECIFIED = 0;
  // A charge failed on the live payment method: update it in the portal.
  PAST_DUE_REASON_DECLINED = 1;
  // No live payment method to charge: add one at checkout.
  PAST_DUE_REASON_REAUTHORIZE = 2;
}

// SubscriptionStatus is the provider subscription behind the entitlement, in pug's
// own vocabulary. Only UNSPECIFIED, ACTIVE and PAST_DUE are ever emitted -- the
// rest exist because a stored row holds them.
enum SubscriptionStatus {
  // No live subscription: trialing, free, comped, or no provider configured.
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_ACTIVE = 1;
  // The provider holds the mandate past due, and pug still charges it. The
  // entitlement is UNCHANGED: worth a banner, never a block.
  SUBSCRIPTION_STATUS_PAST_DUE = 2;
  SUBSCRIPTION_STATUS_PAUSED = 3;
  SUBSCRIPTION_STATUS_CANCELLED = 4;
  SUBSCRIPTION_STATUS_EXPIRED = 5;
  SUBSCRIPTION_STATUS_FAILED = 6;
}

message GetBillingStatusRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Plan is the card or deal as this org holds it, overrides applied.
message Plan {
  string slug = 1;
  string display_name = 2;
  // 3 was price_cents: usage is priced per event, so no card has a single price.
  // Read rate_card or custom_terms instead.
  reserved 3;
  // ISO 4217.
  string currency = 4;
}

message GetBillingStatusResponse {
  // False on a deployment with billing switched off. Hide every billing surface.
  bool billing_enabled = 1;
  Plan plan = 2;
  BillingStatus status = 3;
  // Events the org may send this period. ABSENT means NO QUOTA -- billing is off,
  // or the plan carries none. Never render its absence as 0.
  google.protobuf.Int64Value included_events = 4;
  // When the trial ends, or when it ended. Kept once past, where it says why an
  // org is on the free floor. Absent only with billing switched off.
  google.protobuf.Timestamp trial_ends_at = 5;
  // When a granted plan lapses back to the free floor; absent means open-ended.
  // The end of the agreement, NOT of the quota window.
  google.protobuf.Timestamp contract_ends_at = 6;
  // The quota window, which runs from the org's billing anniversary. Identical to
  // GetUsage's period bounds, which is what makes "X of Y" like for like.
  google.protobuf.Timestamp period_start = 7;
  google.protobuf.Timestamp period_end = 8;
  SubscriptionStatus subscription_status = 9;
  // 10 was current_period_end: the provider no longer bills on a schedule of its
  // own, so the date that matters is when pug charges the running period.
  reserved 10;
  // Whether a checkout would open at all -- billing on, a provider configured, and
  // a mandate product to check out against. Per plan it is PlanOption.purchasable.
  bool purchasable = 11;
  // Days of event history the plan promises. ABSENT means NO BOUND and is never
  // zero. Nothing in pug deletes on this number today.
  google.protobuf.Int64Value retention_days = 13;
  // Whether a portal session would open: this org has a customer at the provider,
  // which only a checkout leaves behind. Not implied by subscription_status.
  bool manageable = 12;
  // Exactly one of these is set while billing is on and the plan resolves.
  RateCard rate_card = 14;
  CustomTerms custom_terms = 15;
  // A live payment method pug can charge. False is an org that owes nothing
  // because nothing can be collected from it, not an org with no usage.
  bool chargeable = 16;
  // Set exactly when status is PAST_DUE.
  PastDueReason past_due_reason = 17;
}

message CreateCheckoutSessionRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // The current card's slug, or custom. Never a price and never a product id.
  string plan_slug = 2 [(buf.validate.field).string.min_len = 1];
  // The mode the overlay opens over, so it does not land light on a dark page.
  // The dashboard's resolved theme, not the stored preference -- "system" is
  // already resolved by the time this is sent. UNSPECIFIED leaves the provider's
  // own configured default -- it does not follow the buyer's OS.
  CheckoutTheme theme = 3 [(buf.validate.field).enum.defined_only = true];
}

enum CheckoutTheme {
  CHECKOUT_THEME_UNSPECIFIED = 0;
  CHECKOUT_THEME_LIGHT = 1;
  CHECKOUT_THEME_DARK = 2;
}

message CreateCheckoutSessionResponse {
  // Send the buyer here. Single-use and short-lived; never store it.
  string checkout_url = 1;
  // Hand back to ConfirmCheckout when the buyer returns. Not proof: the server
  // re-reads the checkout. Empty if the provider gives no id.
  string session_id = 2;
}

message ConfirmCheckoutRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // Bounded to the provider's own id alphabet: it is echoed into the provider's
  // URL path, where a `../` would address another endpoint with pug's API key.
  string session_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

message ConfirmCheckoutResponse {
  // False is "not settled yet", never a failure; a checkout that will not settle
  // is an error instead.
  bool confirmed = 1;
}

message CreatePortalSessionRequest {
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

message CreatePortalSessionResponse {
  string portal_url = 1;
}

message ListPlansRequest {
  // Scoped to an org because the options are: custom is offered only to the org
  // whose row records a deal.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
}

// PlanOption is a plan as this deployment sells it. Plan is a plan as ONE ORG
// holds it, overrides applied.
message PlanOption {
  string slug = 1;
  string display_name = 2;
  // 3 was price_cents, 5 included_events and 7 retention_days: rate_card or
  // custom_terms carries the allowance, and retention is the same on every card.
  reserved 3, 5, 7;
  // ISO 4217.
  string currency = 4;
  // Whether a checkout for THIS plan would open -- the same helper
  // CreateCheckoutSession refuses on, so a dead button is impossible.
  bool purchasable = 6;
  // Exactly one of these is set.
  RateCard rate_card = 8;
  CustomTerms custom_terms = 9;
}

message ListPlansResponse {
  repeated PlanOption plans = 1;
}
