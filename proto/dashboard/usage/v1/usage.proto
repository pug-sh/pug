edition = "2023";
package dashboard.usage.v1;

import "buf/validate/validate.proto";
import "common/v1/time.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/dashboard/usage/v1;usagev1";

service UsageService {
  // Returns how many events the org's projects recorded in the current billing
  // period — which runs from the org's billing anchor, defaulting to its signup
  // anniversary rather than the 1st of the month — plus the per-project daily
  // series behind it. The numbers come from a
  // scheduled meter whose cadence the deployment sets, so read usage_computed_at
  // for how stale they are rather than assuming one. Both used_events and
  // usage_computed_at are absent if the meter has never run; usage_computed_at
  // alone is present while it is alive but has not summed this period yet.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {}
}

message GetUsageRequest {
  option (buf.validate.message).cel = {
    id: "get_usage.range_max"
    message: "range must not span more than 400 days"
    expression: "!has(this.range) || this.range.to - this.range.from <= duration('9600h')"
  };

  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // Bounds the daily series only; used_events always covers the current period.
  // Absent means the current period. The bounds snap outwards to whole UTC days,
  // since that is the grain the counts are stored at — asking for half a day
  // returns that day's whole cell. Metered days are pruned once they age past the
  // retention window, so a longer range simply returns fewer rows than it asked
  // for rather than failing.
  common.v1.TimeRange range = 2;
}

// UsageDay is one metered (project, day) cell. Cells are per project so a client
// can break the series down or sum it; days with no events have no row.
message UsageDay {
  // UTC midnight starting the day the events were recorded.
  //
  // This is a DATE carried as an instant, so format it in UTC. A client west of
  // UTC that renders it in local time (`new Date(day)` in a browser, say) shows
  // the PREVIOUS day for every cell.
  google.protobuf.Timestamp day = 1;
  string project_id = 2;
  int64 event_count = 3;
}

message GetUsageResponse {
  // Distinct events recorded across all of the org's projects this period.
  // MEANINGLESS unless `counted` is true — never render it as 0 on its own.
  //
  // It is absent on the wire until the meter has summed this period, but do not
  // rely on that: protoc-gen-es renders an edition-2023 singular scalar as a
  // non-optional bigint, so absence reaches a TypeScript client as 0.
  int64 used_events = 1;
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  // When the meter last ran for this org, in any period. ABSENT means it never
  // has — there is no answer at all, which a deployment not running
  // `pug cron usage` must render as "unknown" rather than "0".
  google.protobuf.Timestamp usage_computed_at = 4;
  // Per-project daily counts over the requested window, oldest first, capped at
  // 10,000 rows. A row is (day x project), so a wide window on an org with many
  // projects can reach the cap and lose its newest days; narrow the range if the
  // series looks short.
  repeated UsageDay daily = 5;
  // Whether used_events is a measurement of THIS period. With
  // usage_computed_at it carries three states:
  //
  //   - no stamp: the meter has never run. Render "unknown".
  //   - stamp, not counted: it has not reached this period yet (just after a
  //     period boundary, when the stamp is the previous period's). "Computing".
  //   - stamp, counted: used_events is a real total, and a 0 there is a real 0.
  //
  // Read this rather than comparing usage_computed_at against period_start.
  bool counted = 6;
}
