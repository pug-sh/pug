edition = "2023";
package dashboard.orgs.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/dashboard/orgs/v1;orgsv1";

enum OrgRole {
  ORG_ROLE_UNSPECIFIED = 0;
  ORG_ROLE_ADMIN = 1;
  ORG_ROLE_MEMBER = 2;
  ORG_ROLE_VIEWER = 3;
}

enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_PENDING = 1;
  INVITATION_STATUS_ACCEPTED = 2;
}

service OrgsService {
  rpc List(ListRequest) returns (ListResponse) {}
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc UpdateDisplayName(UpdateDisplayNameRequest) returns (UpdateDisplayNameResponse) {}
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {}
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {}
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {}
  rpc ResendInvite(ResendInviteRequest) returns (ResendInviteResponse) {}
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {}
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {}
  rpc Create(CreateRequest) returns (CreateResponse) {}
  rpc Leave(LeaveRequest) returns (LeaveResponse) {}
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {}
  // ListDomains returns the org's domain settings and its domains.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {}
  // SetDomainSettings replaces both settings. Turning auto-join on or up to Member,
  // or org creation off, needs a verified domain and re-checks the org's DNS records.
  rpc SetDomainSettings(SetDomainSettingsRequest) returns (SetDomainSettingsResponse) {}
  // AddDomain adds a pending domain, or returns the org's existing one.
  rpc AddDomain(AddDomainRequest) returns (AddDomainResponse) {}
  // VerifyDomain checks a pending domain's TXT record now. A verified one is returned as is.
  rpc VerifyDomain(VerifyDomainRequest) returns (VerifyDomainResponse) {}
  // RemoveDomain drops the org's claim. Members who joined through it stay. It is refused
  // while the domain requires SSO and this org's connection signs it in.
  rpc RemoveDomain(RemoveDomainRequest) returns (RemoveDomainResponse) {}
  // UpdateDomain turns Require SSO on or off for this org's claim. Turning it on needs a
  // verified domain that someone signed in to through SSO, and re-checks its DNS record.
  rpc UpdateDomain(UpdateDomainRequest) returns (UpdateDomainResponse) {}
  // ListSSOConnections returns the org's SSO connections, without their secrets.
  rpc ListSSOConnections(ListSSOConnectionsRequest) returns (ListSSOConnectionsResponse) {}
  // SetSSOConnection creates a connection, or updates the one connection_id names. New domains
  // and a new issuer re-check TXT. A new issuer or client id needs the secret again, and a new
  // issuer unlinks accounts. A domain can't be taken off while any org requires SSO for it.
  rpc SetSSOConnection(SetSSOConnectionRequest) returns (SetSSOConnectionResponse) {}
  // DeleteSSOConnection unlinks the connection's accounts. It is refused while any org
  // requires SSO for one of its domains.
  rpc DeleteSSOConnection(DeleteSSOConnectionRequest) returns (DeleteSSOConnectionResponse) {}
}

enum DomainStatus {
  DOMAIN_STATUS_UNSPECIFIED = 0;
  DOMAIN_STATUS_PENDING = 1;
  DOMAIN_STATUS_VERIFIED = 2;
}

enum DomainVerificationMethod {
  DOMAIN_VERIFICATION_METHOD_UNSPECIFIED = 0;
  DOMAIN_VERIFICATION_METHOD_DNS = 1;
  // Marked verified by the server's operator with `pug domains verify`.
  DOMAIN_VERIFICATION_METHOD_OPERATOR = 2;
}

message Org {
  string display_name = 1;
  string id = 2;
  OrgRole role = 3;
}

message OrgMember {
  string customer_id = 1;
  string display_name = 2;
  string email = 3;
  string org_id = 4;
  OrgRole role = 5;
  // The verified domain the member auto-joined through; empty otherwise.
  string joined_via_domain = 6;
}

message OrgInvitation {
  string email = 1;
  string expires_at = 2;
  string id = 3;
  string org_id = 4;
  InvitationStatus status = 5;
  OrgRole role = 6;
}

message ListRequest {}

message ListResponse {
  repeated Org orgs = 1;
  // False when the caller's email domain restricts org creation.
  bool can_create_org = 2;
}

message GetRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message GetResponse {
  Org org = 1;
}

message UpdateDisplayNameRequest {
  string display_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 150
  ];
  string org_id = 2 [(buf.validate.field).required = true];
}

message UpdateDisplayNameResponse {
  Org org = 1;
}

message ListMembersRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message ListMembersResponse {
  repeated OrgMember members = 1;
}

message RemoveMemberRequest {
  string customer_id = 1 [(buf.validate.field).required = true];
  string org_id = 2 [(buf.validate.field).required = true];
}

message RemoveMemberResponse {}

message InviteMemberRequest {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  string org_id = 2 [(buf.validate.field).required = true];
  // Optional; when omitted/UNSPECIFIED the invite is issued for ORG_ROLE_MEMBER.
  OrgRole role = 3 [(buf.validate.field).enum.defined_only = true];
}

message InviteMemberResponse {
  OrgInvitation invitation = 1;
}

message ResendInviteRequest {
  string invitation_id = 1 [(buf.validate.field).required = true];
  string org_id = 2 [(buf.validate.field).required = true];
}

message ResendInviteResponse {
  OrgInvitation invitation = 1;
}

message RevokeInviteRequest {
  string invitation_id = 1 [(buf.validate.field).required = true];
  string org_id = 2 [(buf.validate.field).required = true];
}

message RevokeInviteResponse {}

message ListInvitationsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message ListInvitationsResponse {
  repeated OrgInvitation invitations = 1;
}

message CreateRequest {
  string display_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 150
  ];
}

message CreateResponse {
  Org org = 1;
}

message LeaveRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message LeaveResponse {}

message UpdateMemberRoleRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string customer_id = 2 [(buf.validate.field).required = true];
  OrgRole role = 3 [(buf.validate.field) = {
    required: true
    enum: {defined_only: true, not_in: [0]}
  }];
}

message UpdateMemberRoleResponse {
  OrgMember member = 1;
}

message OrgDomain {
  string id = 1;
  string domain = 2;
  DomainStatus status = 3;
  // UNSPECIFIED while pending.
  DomainVerificationMethod verification_method = 4;
  // The TXT record that proves the domain, e.g. _pug-verification.acme.com.
  string txt_record_name = 5;
  string txt_record_value = 6;
  // RFC 3339; empty while pending.
  string verified_at = 7;
  // True when another org that verified this domain turned org creation off.
  // Set only by ListDomains, and only on a verified domain.
  bool org_creation_restricted_elsewhere = 8;
  // Accounts on the domain may sign in only through SSO.
  bool require_sso = 9;
  // Someone has signed in through SSO with an account on the domain since it was verified,
  // and since an SSO connection last dropped it or changed issuer. Require SSO can't be
  // turned on before that.
  bool sso_seen = 10;
  // True when another org that verified this domain requires SSO for it.
  // Set only by ListDomains, and only on a verified domain.
  bool sso_required_elsewhere = 11;
  // The org's SSO connection that signs the domain in; empty when none does.
  string sso_connection_id = 12;
  // True when another org's SSO connection signs the domain in.
  // Set only by ListDomains, and only on a verified domain.
  bool sso_connection_elsewhere = 13;
}

message DomainSettings {
  // The role auto-join grants; UNSPECIFIED means auto-join is off.
  OrgRole auto_join_role = 1;
  bool members_can_create_orgs = 2;
}

message ListDomainsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message ListDomainsResponse {
  DomainSettings settings = 1;
  repeated OrgDomain domains = 2;
}

message SetDomainSettingsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  // UNSPECIFIED turns auto-join off. Otherwise member or viewer: never admin, nor any OrgRole value added later.
  OrgRole auto_join_role = 2 [(buf.validate.field).enum = {
    in: [0, 2, 3]
  }];
  // Required so an omitted field can't silently turn org creation off.
  bool members_can_create_orgs = 3 [(buf.validate.field).required = true];
}

message SetDomainSettingsResponse {
  DomainSettings settings = 1;
}

message AddDomainRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string domain = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.hostname = true
  ];
}

message AddDomainResponse {
  OrgDomain domain = 1;
}

message VerifyDomainRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string domain_id = 2 [(buf.validate.field).required = true];
}

message VerifyDomainResponse {
  OrgDomain domain = 1;
}

message RemoveDomainRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string domain_id = 2 [(buf.validate.field).required = true];
}

message RemoveDomainResponse {}

message UpdateDomainRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string domain_id = 2 [(buf.validate.field).required = true];
  // Required so an omitted field can't silently turn Require SSO off.
  bool require_sso = 3 [(buf.validate.field).required = true];
}

message UpdateDomainResponse {
  OrgDomain domain = 1;
}

message SSOConnection {
  string id = 1;
  // The sign-in button's label.
  string label = 2;
  string issuer_url = 3;
  string client_id = 4;
  repeated SSOConnectionDomain domains = 5;
}

message SSOConnectionDomain {
  string id = 1;
  string domain = 2;
}

message ListSSOConnectionsRequest {
  string org_id = 1 [(buf.validate.field).required = true];
}

message ListSSOConnectionsResponse {
  repeated SSOConnection connections = 1;
}

message SetSSOConnectionRequest {
  option (buf.validate.message).cel = {
    id: "set_sso_connection.secret_required"
    message: "client_secret is required for a new connection"
    expression: "has(this.connection_id) || this.client_secret != ''"
  };
  string org_id = 1 [(buf.validate.field).required = true];
  // Unset creates a connection.
  string connection_id = 2 [(buf.validate.field).string.len = 20];
  string label = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ];
  string issuer_url = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ];
  string client_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];
  // Empty keeps the stored secret, unless the issuer or client id changes or the server's key
  // can't read it.
  string client_secret = 6 [(buf.validate.field).string.max_len = 4096];
  // The org's verified domains the connection signs in.
  repeated string domain_ids = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

message SetSSOConnectionResponse {
  SSOConnection connection = 1;
}

message DeleteSSOConnectionRequest {
  string org_id = 1 [(buf.validate.field).required = true];
  string connection_id = 2 [(buf.validate.field).required = true];
}

message DeleteSSOConnectionResponse {}
