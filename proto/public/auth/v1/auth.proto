edition = "2023";
package public.auth.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/pug-sh/pug/internal/gen/proto/public/auth/v1;authv1";

service AuthService {
  // GetAuthConfig returns the non-secret provider settings the browser needs to
  // render sign-in options and start Authorization Code + PKCE flows.
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse) {}
  rpc SignInWithEmail(SignInWithEmailRequest) returns (SignInWithEmailResponse) {}
  rpc RequestMagicLink(RequestMagicLinkRequest) returns (RequestMagicLinkResponse) {}
  rpc CompleteMagicLink(CompleteMagicLinkRequest) returns (CompleteMagicLinkResponse) {}
  // CompleteOIDCSignIn exchanges a browser-supplied Authorization Code on the
  // server, keeping confidential-provider secrets out of the dashboard.
  rpc CompleteOIDCSignIn(CompleteOIDCSignInRequest) returns (CompleteOIDCSignInResponse) {}
  // RefreshSession exchanges a valid refresh token for a new access+refresh pair.
  // Public (no JWT): it runs precisely when the access token has expired.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse) {}
  // SignOut revokes the refresh token's rotation family. Best-effort: a stale or
  // unknown token still returns success.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {}
  // DemoSignIn mints a session for the read-only demo viewer account with no
  // credentials, so a visitor landing on the public demo page is authenticated
  // in viewer mode. Gated by PUG_DEMO_ENABLED on the server; returns UNAVAILABLE
  // when disabled or when the demo account has not been seeded.
  rpc DemoSignIn(DemoSignInRequest) returns (DemoSignInResponse) {}
}

message SignInWithEmailRequest {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  // bcrypt accepts at most 72 bytes; rejecting longer inputs at the
  // interceptor avoids surfacing bcrypt.ErrPasswordTooLong as CodeInternal.
  string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_bytes = 72
  ];
}

message SignInWithEmailResponse {
  string token = 1; // short-lived access JWT
  string refresh_token = 2; // long-lived opaque refresh token
}

message RequestMagicLinkRequest {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
}

message RequestMagicLinkResponse {}

message CompleteMagicLinkRequest {
  string token = 1 [(buf.validate.field).required = true];
  // Optional IANA timezone captured from the browser completing the link. When the
  // link provisions a new account (default org + project), it is stored as that
  // project's reporting_timezone. Empty = UTC; a malformed value is coerced to UTC.
  string timezone = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_+/-]*$"
  }];
}

message CompleteMagicLinkResponse {
  string token = 1; // short-lived access JWT
  string refresh_token = 2; // long-lived opaque refresh token
}

message CompleteOIDCSignInRequest {
  string provider_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 63
      pattern: "^[a-z][a-z0-9_-]*$"
    }
  ];
  string code = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 8192
    }
  ];
  string code_verifier = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 43
      max_len: 128
      pattern: "^[A-Za-z0-9._~-]+$"
    }
  ];
  string redirect_uri = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 2048
  ];
  // min_len, not just required: `required` is a presence check, so "" would pass.
  string nonce = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 16
      max_len: 128
    }
  ];
  string timezone = 6 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_+/-]*$"
  }];
}

message CompleteOIDCSignInResponse {
  string token = 1;
  string refresh_token = 2;
}

message GetAuthConfigRequest {}

enum AuthProviderType {
  AUTH_PROVIDER_TYPE_UNSPECIFIED = 0;
  AUTH_PROVIDER_TYPE_OIDC = 1;
}

message AuthProviderConfig {
  string id = 1;
  AuthProviderType type = 2;
  string display_name = 3;
  string client_id = 4;
  string issuer_url = 5;
  repeated string scopes = 6;
}

message GetAuthConfigResponse {
  repeated AuthProviderConfig providers = 1;
}

message RefreshSessionRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message RefreshSessionResponse {
  string token = 1; // new short-lived access JWT
  string refresh_token = 2; // rotated refresh token (replaces the one sent)
}

message SignOutRequest {
  // The refresh token to revoke. Optional: an empty/stale token is a no-op so a
  // client without a stored token can still call SignOut idempotently.
  string refresh_token = 1;
}

message SignOutResponse {}

message DemoSignInRequest {}

message DemoSignInResponse {
  string token = 1; // short-lived access JWT for the demo viewer
  string refresh_token = 2; // long-lived opaque refresh token
  // The demo project to scope reads to; the client sends it back as the
  // x-project-id header on subsequent dashboard/insights/profile requests.
  string project_id = 3;
}
