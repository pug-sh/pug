name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "14 * * * *"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      # A fork's PR token is read-only, so only main's runs upload to code scanning.
      upload-sarif: ${{ github.event_name != 'pull_request' }}
