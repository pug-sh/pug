name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GOMODCACHE: /home/runner/go/pkg/mod
  GOCACHE: /home/runner/.cache/go-build

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Download modules and compile tools
        run: go mod download && go install tool

      - name: Test
        run: make cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Download modules and compile tools
        run: go mod download && go install tool

      # Every check runs even when an earlier one fails, so one push reports
      # every category instead of stopping at the first.
      - name: Format
        run: make lint-fmt

      - name: Migration numbering
        if: '!cancelled()'
        run: make lint-migrations

      - name: Lint
        if: '!cancelled()'
        run: make lint

      - name: Dead code
        if: '!cancelled()'
        run: make lint-dead

      - name: Duplicate code
        if: '!cancelled()'
        run: make lint-dupl

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Download modules and compile tools
        run: go mod download && go install tool

      - name: Check go.mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Check sqlc drift
        run: make sqlc && git diff --exit-code internal/gen/repo/

      - name: Check protobuf drift
        run: make rpc && git diff --exit-code internal/gen/proto/

      - name: Check templ drift
        run: make templ && git diff --exit-code internal/core/email/templates/

  # Images only build on a release tag, so a broken Dockerfile would otherwise
  # surface on release day. One build per target (not per image) is enough to
  # prove it compiles; the release job still builds all twelve.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: app, cmd: server }
          - { target: worker, cmd: workers/events }
          - { target: migrate, cmd: migrate/postgres }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            CMD=${{ matrix.cmd }}
          # Native arch only; the release job is what proves the arm64 cross-build.
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.target }}
          cache-to: type=gha,scope=pr-${{ matrix.target }},mode=max
