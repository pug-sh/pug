name: Buf CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  delete:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # buf-action authenticates via its own token inputs (github_token,
          # BUF_TOKEN); it needs no persisted git credentials.
          persist-credentials: false
      - uses: bufbuild/buf-action@v1.7.0
        with:
          # Keep in sync with the buf version pinned in go.mod (go tool buf / make rpc).
          version: 1.71.0
          # We keep proto files hand-aligned (vertical = columns), which buf
          # format flattens, so the format check is disabled. Lint + breaking
          # change detection + BSR push still run.
          format: false
          token: ${{ secrets.BUF_TOKEN }}

  # Starts Leo's proto sync (pug-sh/leo) once the BSR has pug's new protos. It also turns Leo's
  # scheduled workflows back on, since GitHub turns off a public repo's schedules after 60 days
  # without activity. The REST call, unlike gh workflow enable, succeeds when one is already on.
  leo:
    needs: buf
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.LEO_CLIENT_ID }}
          private-key: ${{ secrets.LEO_PRIVATE_KEY }}
          owner: pug-sh
          repositories: leo
          permission-actions: write

      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api --method PUT repos/pug-sh/leo/actions/workflows/inbox.yml/enable
          gh api --method PUT repos/pug-sh/leo/actions/workflows/protos.yml/enable
          gh workflow run protos.yml --repo pug-sh/leo
