version: '2'
sql:
  - engine: 'postgresql'
    queries: 'schema/postgres/queries/read/*.sql'
    schema: 'schema/postgres/migrations'
    gen:
      go:
        sql_package: 'pgx/v5'
        out: 'internal/gen/repo/dbread'
        overrides:
          - db_type: "jsonb"
            go_type:
              type: "map[string]any"
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "map[string]any"
          - column: "dashboard_tiles.thresholds"
            go_type:
              type: "[]byte"
          # Raw bytes: jsonb sorts keys, so a re-serialized payload never
          # re-verifies its signature.
          - column: "billing_webhook_deliveries.payload"
            go_type:
              type: "[]byte"
  - engine: 'postgresql'
    queries: 'schema/postgres/queries/write/*.sql'
    schema: 'schema/postgres/migrations'
    gen:
      go:
        sql_package: 'pgx/v5'
        out: 'internal/gen/repo/dbwrite'
        overrides:
          - db_type: "jsonb"
            go_type:
              type: "map[string]any"
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "map[string]any"
          - column: "dashboard_tiles.thresholds"
            go_type:
              type: "[]byte"
          # Raw bytes: jsonb sorts keys, so a re-serialized payload never
          # re-verifies its signature.
          - column: "billing_webhook_deliveries.payload"
            go_type:
              type: "[]byte"
