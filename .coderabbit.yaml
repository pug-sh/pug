# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
reviews:
  auto_review:
    # On demand only, for everyone. With auto review off a positive label match still
    # triggers, so the label below is the opt-in; `@coderabbitai review` also works.
    enabled: false
    labels:
      - coderabbit
  review_status: false
